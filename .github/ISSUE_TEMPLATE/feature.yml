name: Feature request
description: Propose a capability, workflow, or quality-of-life change
title: "[feature] "
labels: ["needs/triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在哪里不顺手 / 缺什么？谁受影响？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望它怎么工作？有没有参考实现？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 取舍
      description: 有没有更小的做法？会影响哪些 crate 或分层？

  - type: dropdown
    id: area
    attributes:
      label: 区域
      options:
        - render
        - scene / reflect
        - editor
        - engine / app / platform
        - asset / cooker / pipeline
        - Android / launcher
        - CI / tooling
        - docs
        - 不确定
