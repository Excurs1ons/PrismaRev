name: CI

# Full-coverage build/verify pipeline for PrismaRev:
#   - fmt + clippy (fast gate)
#   - desktop Rust build + test (prism-ecs / prism-render / prism-engine / prism-platform)
#   - xtask build + shader-binding codegen regression (no-drift check)
#   - Slang shader compile (.slang -> .spv + reflection JSON) via slangc
#
# Design notes:
#   * Jobs run in parallel: `lint` is a merge gate, not a prerequisite. It only
#     takes ~1m of setup (toolchain, apt, slang) and ~10s of actual linting, so
#     making builds wait for it added a minute to every run.
#   * slangc and the compiled .spv/reflection are cached for lint/desktop with
#     an exact source hash. The shaders job always recompiles so the binding
#     drift check never reads a stale cache.
#   * prism-app depends on android-activity, which only compiles for the
#     aarch64-linux-android target — it is EXCLUDED from the desktop job and
#     built on-device / via the Tauri launcher instead.
#   * xtask is a workspace-excluded build tool; it is built/run from its own dir.
#   * slangc is a glibc binary (no Termux); CI runs it on ubuntu-latest.

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Bump to force-refresh caches when toolchains change.
  CACHE_VERSION: v1
  # Slang release used to compile shaders (both desktop + shaders jobs).
  SLANG_VERSION: "2026.13.1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 0. Doc-only fast path. The three jobs below are required status checks on
  #    `master`; a job skipped by `if` reports "Success", so doc-only PRs stay
  #    mergeable. (Skipping the whole workflow with `paths-ignore` would leave
  #    those checks "Expected" and block the merge.)
  # ---------------------------------------------------------------------------
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          set -u
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          # First push / manual dispatch: nothing to compare against → full CI.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A failed diff can't prove the change is doc-only → fail closed, full CI.
          if ! diff_out=$(git diff --name-only "$base" "$GITHUB_SHA" 2>/dev/null); then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$diff_out" ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(printf '%s\n' "$diff_out" \
            | grep -Ev '^(docs/|.*\.md$|LICENSE.*|\.gitignore$)' || true)
          if [ -n "$changed" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # 1. Formatting + lints. Runs in parallel with the heavier jobs.
  # ---------------------------------------------------------------------------
  lint:
    name: fmt + clippy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ALSA headers (for prism-audio)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install Rust (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.CACHE_VERSION }}-lint

      # clippy compiles prism-render, whose include_bytes! needs the .spv files
      # (gitignored). Compile them before linting.
      - name: Setup slang + compile shaders
        uses: ./.github/actions/setup-slang

      - name: rustfmt --check
        run: cargo fmt --all -- --check

      # Desktop crates only (prism-app needs the NDK target for Android).
      - name: clippy (desktop crates)
        run: >
          cargo clippy
          -p prism-ecs -p prism-gfx -p prism-render -p prism-engine -p prism-platform
          --all-targets -- -D warnings

      # xtask is workspace-excluded, so --all/-p don't reach it. Check it here.
      - name: fmt + clippy (xtask)
        working-directory: crates/xtask
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets -- -D warnings

      # `derive` / `glam` 必须真的是可选特性：关掉默认特性后仍要能编译。
      # 没有这条检查时，`#[cfg(...)]` 一漏就只在有人手动跑时才会暴露。
      - name: check prism-reflect without default features
        run: cargo check -p prism-reflect --no-default-features

  # ---------------------------------------------------------------------------
  # 2. Desktop build + test. The core correctness gate we can fully run in CI.
  # ---------------------------------------------------------------------------
  desktop:
    name: desktop build + test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # ash links against the Vulkan loader at build time only for examples that
      # create a device; the lib itself is loader-agnostic. Install the loader +
      # headers so any test that touches vk symbols links cleanly.
      - name: Install Vulkan loader + headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev vulkan-tools mesa-vulkan-drivers libasound2-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.CACHE_VERSION }}-desktop

      # .spv files are NOT committed (see .gitignore). Compile them here so the
      # include_bytes!-based build has SPIR-V to embed.
      - name: Setup slang + compile shaders
        uses: ./.github/actions/setup-slang

      - name: Build (desktop crates)
        run: >
          cargo build --locked
          -p prism-ecs -p prism-gfx -p prism-render -p prism-engine -p prism-platform

      - name: Test (desktop crates)
        run: >
          cargo test --locked
          -p prism-ecs -p prism-gfx -p prism-render -p prism-engine -p prism-platform

  # ---------------------------------------------------------------------------
  # 2b. GPUI 编辑器（独立 workspace）：数据层单测。UI 层需要桌面 GPU，留给
  #     `scripts/pr_ready.py` 的 `--target x86_64-pc-windows-gnu` 类型检查。
  # ---------------------------------------------------------------------------
  editor-gpui:
    name: editor-gpui core tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.CACHE_VERSION }}-editor-gpui
          workspaces: editor-gpui -> target

      - name: Test (data layer)
        run: >
          cargo test --locked
          --manifest-path editor-gpui/Cargo.toml
          -p prism-editor-gpui-core

  # ---------------------------------------------------------------------------
  # 3. Slang shaders: compile to SPIR-V + reflection, then verify the committed
  #    Rust bindings match freshly-generated ones (drift guard).
  # ---------------------------------------------------------------------------
  shaders:
    name: slang compile + binding drift
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
            key: ${{ env.CACHE_VERSION }}-shaders

      - name: Setup slang + compile shaders
        uses: ./.github/actions/setup-slang
        with:
          cache_shaders: "false"

      - name: slangc version
        run: "$SLANGC -v"

      # Always upload the freshly compiled SPIR-V + reflection JSON (survives
      # even if the drift check below fails), so the artifacts can be committed
      # to the repo for hosts without slangc.
      - name: Upload compiled SPIR-V + reflection (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spirv
          path: |
            assets/shaders/*.spv
            assets/shaders/reflection/*.json
          if-no-files-found: warn

      # Debug artifact: always upload the real slangc-produced reflection JSON
      # so the actual schema can be inspected (e.g. when the xtask parser needs
      # recalibration). Survives even if the drift check below fails.
      - name: Upload real reflection JSON (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slang-reflection-real
          path: assets/shaders/reflection/*.json
          if-no-files-found: warn

      - name: Regenerate Rust shader bindings from fresh reflection
        run: |
          cd crates/xtask
          cargo run --locked --bin shader-bindgen -- \
            ../../assets/shaders/reflection ../../crates/prism-render/src/shader_bindings

      - name: Fail if committed bindings drift from source
        run: |
          # The generated Rust bindings are committed and MUST match what
          # bindgen produces from the freshly compiled reflection JSON. Any
          # drift means someone edited a shader without regenerating — fail.
          # (.spv files are not committed; their freshness is enforced by the
          # compile step above — this job recompiles them on every run.)
          drift=0
          if ! git diff --quiet -- crates/prism-render/src/shader_bindings/; then
            echo "::error::shader_bindings/ is out of date. Run assets/shaders/compile.sh + xtask and commit."
            git diff -- crates/prism-render/src/shader_bindings/
            drift=1
          fi
          if [ "$drift" -ne 0 ]; then exit 1; fi
          echo "Shader bindings are up to date."
