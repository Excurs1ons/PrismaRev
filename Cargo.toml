[package]
name = "prismarev"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PrismaRev game engine"

[[bin]]
name = "prismarev"
path = "src/main.rs"

[dependencies]
prism-engine = { path = "crates/prism-engine" }
prism-ecs = { path = "crates/prism-ecs" }
prism-render = { path = "crates/prism-render" }
prism-editor = { path = "crates/prism-editor" }
prism-audio = { path = "crates/prism-audio" }
prism-asset-core = { path = "prism-asset/prism-asset-core" }
prism-asset-runtime = { path = "prism-asset/prism-asset-runtime" }
prism-asset-types = { path = "prism-asset/prism-asset-types" }
winit = { workspace = true }
ash-window = { workspace = true }
raw-window-handle = { workspace = true }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
anyhow = { workspace = true }

[workspace]
resolver = "2"
members = [
    "crates/prism-ecs",
    "crates/prism-render",
    "crates/prism-engine",
    "crates/prism-editor",
    "crates/prism-bake-gi",
    "crates/prism-android",
    "crates/prism-audio",
]
# xtask (Slang reflection -> Rust binding codegen) is a build-time tool run only
# on desktop/CI hosts that have slangc. Excluded so it never enters the default
# workspace build (keeps Termux/Android `cargo check` free of its deps).
exclude = ["xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Vulkan
ash = "0.38"
ash-window = "0.13"
raw-window-handle = "0.6"

# Window / events
winit = "0.30"

# egui (real-time inspector UI). egui-ash-renderer 0.11 targets ash 0.38 and
# egui 0.33; egui-winit 0.33 matches egui 0.33 and winit 0.30. Kept at the
# workspace level so prism-render (Vulkan backend) and prism-engine (UI +
# event handling) resolve to the same versions.
egui = "0.33"
egui-winit = "0.33"
egui-ash-renderer = "0.11"

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
anyhow = "1"

# Serialization / async / errors. These keys are also resolved by the
# independent `prism-asset/` workspace crates when they are path-dependended
# from this root workspace (e.g. prism-asset-runtime used by prism-engine).
# Keep versions in sync with prism-asset/Cargo.toml `[workspace.dependencies]`.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
bincode = "1.3"
tokio = { version = "1", features = ["full"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = { version = "0.13", features = ["experimental"] }
thiserror = "1"
path-clean = "1"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga", "bmp", "hdr", "exr"] }
ctt = { version = "0.5", default-features = false, features = ["encoder-bc7enc", "ispc-prebuilt"] }
unicode-width = "0.2"
dirs = "5"

# Asset / scene loading
# `gltf` crate version is the crate's release stream (1.4 = current), not the
# glTF spec version - the crate loads glTF 2.0 regardless of its own version.
gltf = { version = "1.4", features = ["KHR_materials_transmission", "KHR_materials_emissive_strength", "KHR_materials_ior", "extensions"] }
slotmap = "1.0"
rayon = "1.10"

[profile.dev]
opt-level = 1          # ash/Vulkan has a lot of codegen; light opt keeps debug builds usable

[profile.release]
opt-level = 3
lto = "thin"
