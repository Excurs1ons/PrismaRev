# Virtual scene-asset manifest.
#
# Maps a logical scene name to a filesystem path. The engine loads the FIRST
# entry whose `path` exists on disk, so you can list several (e.g. a portable
# relative path first, then an absolute dev path) and only the available one
# is used. Edit `path` freely - it is never hardcoded in code.
#
# Two formats are supported:
#   - `.rscn`  : cooked binary for the new scene system (SceneLoader). Spawns
#                camera + lights directly into the ECS - the scene file owns
#                camera placement. Preferred for engine-builtin scenes.
#   - `.gltf`  : legacy glTF import (try_load_gltf + load_demo_scene).
#
# Engine-builtin default scene: a camera at [0, 2.5, 18] looking at the origin
# plus a directional sun and three coloured point lights. Cooked from
# default.scene.json via prism-asset-cooker's SceneCooker (re-cook with the
# `cook_default_scene_to_disk` ignored test, see scene.rs).

[[scenes]]
name = "default"
path = "scenes/default.rscn"

# Sponza (NewSponza_Main by EPIC/arturisyty, CC0) - glTF 2.0 with external
# .bin + 137 PNG textures. The glTF references textures via relative
# `textures/...` paths resolved next to the .gltf, so the directory layout
# must be preserved.

[[scenes]]
name = "sponza"
path = "D:/Download/main_sponza/main_sponza/NewSponza_Main_glTF_003.gltf"

