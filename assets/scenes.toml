# Virtual scene-asset manifest.
#
# Maps a logical scene name to a scene asset path. The `path` is a lookup key
# into the resource package's path manifest (assets/scenes.pak.meta.json): the
# engine resolves it to an AssetId and loads the scene CONTENT from the .pak via
# the ResourceManager. There is no disk-file fallback — scenes must be cooked
# into assets/scenes.pak first (prism-asset-cli scan → import → build).
#
# Supported scene content formats inside the package:
#   - `.rscn`   : cooked binary (production).

# Intro scene (开场动画): 4 UI entities (overlay + title + subtitle + prompt).
# The engine loads the FIRST entry registered in the resource package, so intro
# takes priority.
[[scenes]]
name = "intro"
path = "scenes/intro.scene.json"

# Engine-builtin default scene: a camera at [0, 2.5, 18] looking at the origin
# plus a directional sun and three coloured point lights. Cooked from
# default.scene.json via prism-asset-cooker's SceneCooker.

[[scenes]]
name = "default"
path = "scenes/default.rscn"

# Sponza (NewSponza_Main by EPIC/arturisyty, CC0) - glTF 2.0 with external
# .bin + 137 PNG textures. The glTF references textures via relative
# `textures/...` paths resolved next to the .gltf, so the directory layout
# must be preserved.

[[scenes]]
name = "sponza"
path = "D:/Download/main_sponza/main_sponza/NewSponza_Main_glTF_003.gltf"

# Example of a portable fallback (uncomment / adjust as needed):
