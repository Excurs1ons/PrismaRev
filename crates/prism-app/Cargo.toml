[package]
name = "prism-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Platform application layer — owns the event loop, window, and frame orchestration"

[lib]
# rlib for desktop linking; cdylib for Android `android_main` JNI entry.
crate-type = ["lib", "cdylib"]

[dependencies]
prism-engine = { path = "../prism-engine" }
prism-render = { path = "../prism-render" }
prism-platform = { path = "../prism-platform" }
prism-editor = { path = "../prism-editor" }
prism-audio = { path = "../prism-audio" }
prism-asset = { path = "../prism-asset", default-features = false, features = ["core", "runtime"] }
prism-ecs = { path = "../prism-ecs" }
glam.workspace = true
rapier3d.workspace = true
flume.workspace = true

winit = { workspace = true }
egui = { workspace = true }
egui-winit = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
anyhow = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
