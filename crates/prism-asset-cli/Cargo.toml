[package]
name = "prism-asset-cli"
version.workspace = true
edition = "2021"
license.workspace = true
description = "CLI tool for the prism-asset pipeline"

[dependencies]
prism-asset-core = { path = "../prism-asset-core" }
prism-asset-db = { path = "../prism-asset-db" }
prism-asset-package = { path = "../prism-asset-package" }
prism-asset-runtime = { path = "../prism-asset-runtime", features = ["hot-reload"] }
prism-asset-importer = { path = "../prism-asset-importer" }
prism-asset-cooker = { path = "../prism-asset-cooker" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = { workspace = true }
unicode-width = { workspace = true }

[dev-dependencies]
tempfile = "3"
image = { workspace = true }
xxhash-rust = { workspace = true }