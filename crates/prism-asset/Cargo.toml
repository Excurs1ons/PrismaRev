[package]
name = "prism-asset"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Runtime asset formats: AssetId/Handle, .pak package, ResourceManager, streaming"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { version = "1", features = ["v4"] }

typetag = { version = "0.2", optional = true }

tokio = { workspace = true, optional = true }
tracing = { version = "0.1", optional = true }

zstd = { workspace = true, optional = true }
xxhash-rust = { version = "0.8", features = ["xxh3"], optional = true }

[features]
default = ["runtime", "types", "streaming"]
asset-data = ["dep:typetag"]
core = []
# tokio 只为 `*_async` 变体存在（运行时默认走同步 IO），默认不进玩家二进制。
async-io = ["dep:tokio"]
runtime = ["dep:tracing", "core", "package"]
package = ["core", "dep:zstd", "dep:xxhash-rust"]
# 兼容别名：热重载轮询器现在总是随 `runtime` 编译，打开这个 feature 不再有副作用。
hot-reload = ["runtime"]
streaming = ["runtime"]
types = ["core", "asset-data"]

[dev-dependencies]
tempfile = "3"
bincode = { workspace = true }
