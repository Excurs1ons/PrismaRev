[package]
name = "prism-editor-tool"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Editor tools: heightmap generator, terrain utilities, etc."

[lib]
name = "prism_editor_tool"
path = "src/lib.rs"

[[bin]]
name = "prism-editor-tool"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
clap = { workspace = true }
image = { workspace = true }
rayon = { workspace = true }
rand = { workspace = true, features = ["small_rng"] }
