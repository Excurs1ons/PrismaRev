[package]
name = "prism-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "egui editor UI for PrismaRev (inspector, debug, render settings, baking)"

[dependencies]
prism-ecs = { path = "../prism-ecs" }
prism-render = { path = "../prism-render" }
glam.workspace = true
prism-asset-core = { path = "../prism-asset-core", features = ["asset-data"] }
prism-asset-types = { path = "../prism-asset-types" }
egui = { workspace = true }
winit = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
ash = { workspace = true }
clap = { workspace = true }
serde = { version = "1", features = ["derive"] }
inventory = "0.3"
