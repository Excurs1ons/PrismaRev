[package]
name = "prism-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Application layer and main loop for PrismaRev"

[dependencies]
prism-ecs = { path = "../prism-ecs" }
prism-render = { path = "../prism-render" }
prism-asset = { path = "../prism-asset", default-features = false, features = ["runtime", "cooker", "package", "importer", "db"] }
prism-editor = { path = "../prism-editor" }

prism-audio = { path = "../prism-audio" }
glam.workspace = true
log = { workspace = true }
anyhow = { workspace = true }
rustc-hash = "2"
ash = { workspace = true }
winit = { workspace = true }
egui = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
# Match the same backend winit uses (see prism-android/Cargo.toml). The
# `game-activity` feature selects the GameActivity backend; without it
# android-activity won't compile.
android-activity = { version = "0.6", features = ["game-activity"] }
log = { workspace = true }
