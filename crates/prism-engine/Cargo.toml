[package]
name = "prism-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Application layer and main loop for PrismaRev"

[dependencies]
prism-ecs = { path = "../prism-ecs" }
prism-render = { path = "../prism-render" }
prism-asset-core = { path = "../../prism-asset/prism-asset-core", features = ["asset-data"] }
prism-asset-runtime = { path = "../../prism-asset/prism-asset-runtime" }
prism-asset-cooker = { path = "../../prism-asset/prism-asset-cooker", default-features = false }
prism-asset-types = { path = "../../prism-asset/prism-asset-types" }
prism-editor = { path = "../prism-editor" }

prism-audio = { path = "../prism-audio" }
rapier3d.workspace = true
log = { workspace = true }
anyhow = { workspace = true }
rustc-hash = "2"
ash = { workspace = true }
egui = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
# Match the same backend winit uses (see prism-android/Cargo.toml). The
# `game-activity` feature selects the GameActivity backend; without it
# android-activity won't compile.
android-activity = { version = "0.6", features = ["game-activity"] }
log = { workspace = true }
