[package]
name = "prism-reflect"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "运行时反射（TypeDesc/Value/Registry）与自描述二进制 RTTIBin"

[dependencies]
prism-reflect-derive = { path = "../prism-reflect-derive", optional = true }
glam = { workspace = true, optional = true }

[features]
default = ["derive", "glam"]
derive = ["dep:prism-reflect-derive"]
glam = ["dep:glam"]

[dev-dependencies]
prism-reflect-derive = { path = "../prism-reflect-derive" }
glam = { workspace = true }
