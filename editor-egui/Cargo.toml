[workspace]
resolver = "2"
members = ["crates/prism-editor-egui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
ash = { version = "0.38", default-features = false }
ash-window = "0.13"
egui = "0.33.3"
egui-ash = { git = "https://github.com/tyrypyrking/egui-ash", rev = "258aee2347e66bdb3fdf2f9fc4aa76da06228b0f", features = [
  "gpu-allocator",
] }
env_logger = "0.11"
glam = "0.33"
gpu-allocator = { version = "0.27", default-features = false, features = [
  "vulkan",
] }
log = "0.4"
raw-window-handle = "0.6"
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
