[package]
name = "prismarev"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "PrismaRev 用户游戏项目——桌面二进制，由 launcher/ 以 `prismarev` spawn"

# 独立 workspace（仿 launcher/ 先例），不挂根 PrismaRev workspace。
[workspace]

# Android: GameActivity 加载 libgame.so（`android.app.lib_name` 见 launcher
# gen/android Manifest），JNI `android_main` 在 src/lib.rs。
# `lib` 类型供桌面 bin 链接 rlib；`cdylib` 仅 Android 打包时使用。
[lib]
name = "game"
crate-type = ["lib", "cdylib"]

[dependencies]
prism-app = { path = "../crates/prism-app" }
prism-engine = { path = "../crates/prism-engine" }
prism-ecs = { path = "../crates/prism-ecs" }
keyframe = "1.1"
log = "0.4"
# android_main 签名类型；`android-game-activity` feature 经 prism-app 的
# 依赖图统一启用，此处只需版本匹配。
winit = "0.30"
