[workspace]
resolver = "2"
members = [
    "prism-asset-core",
    "prism-asset-package",
    "prism-asset-db",
    "prism-asset-importer",
    "prism-asset-cooker",
    "prism-asset-runtime",
    "prism-asset-cli",
    "prism-asset-types",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
tokio = { version = "1", features = ["full"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = { version = "0.13", features = ["experimental"] }
thiserror = "1"
anyhow = "1"
path-clean = "1"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga", "bmp", "hdr", "exr"] }
ctt = { version = "0.5", default-features = false, features = ["encoder-bc7enc", "ispc-prebuilt"] }
unicode-width = "0.2"
