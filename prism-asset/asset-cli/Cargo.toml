[package]
name = "asset-cli"
version.workspace = true
edition = "2021"
license.workspace = true
description = "CLI tool for the resource pipeline"

[dependencies]
asset-core = { path = "../asset-core" }
asset-db = { path = "../asset-db" }
asset-package = { path = "../asset-package" }
asset-runtime = { path = "../asset-runtime", features = ["hot-reload"] }
asset-importer = { path = "../asset-importer" }
asset-cooker = { path = "../asset-cooker" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = { workspace = true }
unicode-width = { workspace = true }

[dev-dependencies]
tempfile = "3"
image = { workspace = true }
xxhash-rust = { workspace = true }