# Cozy Fishing 场景清单。
#
# `path` 是资源包内路径清单的查找键：引擎把它解析成 AssetId 后从
# `assets/scenes.pak` 读取 RSCN——没有磁盘回退。烘焙命令（在 projects/fishing 下）：
#
#   cargo run --manifest-path ../../Cargo.toml -p prism-build-pipeline -- \
#     build-scenes --manifest assets/scenes.toml \
#     --staging target/scene_pack --output assets/scenes.pak

[[scenes]]
name = "lake"
path = "scenes/lake.rscn"
