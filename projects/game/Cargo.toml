[package]
name = "prismarev"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "PrismaRev 用户游戏项目——桌面二进制 `prisma`，由 launcher/ spawn"

# 独立 workspace（仿 launcher/ 先例），不挂根 PrismaRev workspace。
[workspace]

# 桌面二进制名 `prisma`（package 名仍为 `prismarev`，供 cargo -p 选择）。
[[bin]]
name = "prisma"
path = "src/main.rs"

# Android: GameActivity 加载 libprisma.so（`android.app.lib_name` 见 launcher
# gen/android Manifest），JNI `android_main` 在 src/lib.rs。
# `lib` 类型供桌面 bin 链接 rlib；`cdylib` 仅 Android 打包时使用。
[lib]
name = "prisma"
crate-type = ["lib", "cdylib"]

[dependencies]
prism-app = { path = "../../crates/prism-app" }
prism-engine = { path = "../../crates/prism-engine" }
keyframe = "1.1"
log = "0.4"
